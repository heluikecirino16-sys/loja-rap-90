
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | RAP 90 STORE</title>
    <link rel="stylesheet" href="../style/style.css">
    <script src="../script/script.js?v=4" defer></script>
</head>
<body data-page="produtos">

<header>
    <h1>RAP 90 STORE</h1>
    <nav>
        <a href="../index.html">Início</a>
        <a href="produtos.html" class="active">Produtos</a>
        <a href="clientes.html">Clientes</a>
        <a href="funcionarios.html">Funcionários</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="itens-pedido.html">Itens do Pedido</a>
    </nav>
</header>

<main class="container">
    <h2>Cadastro de Produtos</h2>

    <section class="panel">
        <form id="formulario">
            <label>Nome</label>
            <input name="nome" placeholder="Nome do produto" required>

            <label>Descrição</label>
            <input name="descricao" placeholder="Descrição do produto">

            <label>Preço</label>
            <input name="preco" type="number" min="0" step="0.01" required>

            <label>Estoque</label>
            <input name="estoque" type="number" min="0" required>

            <button class="btn" type="submit">Cadastrar produto</button>
        </form>
    </section>

    <section class="panel">
        <h2>Produtos cadastrados</h2>
        <table>
            <tbody id="tabela-dados"></tbody>
        </table>
    </section>
</main>

<footer>RAP 90 STORE © 2026</footer>

</body>
</html>

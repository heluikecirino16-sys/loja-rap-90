
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itens do Pedido | RAP 90 STORE</title>
    <link rel="stylesheet" href="../style/style.css">
    <script src="../script/script.js?v=4" defer></script>
</head>
<body data-page="itens-pedido">

<header>
    <h1>RAP 90 STORE</h1>
    <nav>
        <a href="../index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="clientes.html">Clientes</a>
        <a href="funcionarios.html">Funcionários</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="itens-pedido.html" class="active">Itens do Pedido</a>
    </nav>
</header>

<main class="container">
    <h2>Cadastro de Itens do Pedido</h2>

    <section class="panel">
        <form id="formulario">
            <label>ID do pedido</label>
            <input name="id_pedido" type="number" min="1" required>

            <label>ID do produto</label>
            <input name="id_produto" type="number" min="1" required>

            <label>Quantidade</label>
            <input name="quantidade" type="number" min="1" required>

            <label>Preço unitário</label>
            <input name="preco_unitario" type="number" min="0" step="0.01" required>

            <button class="btn" type="submit">Cadastrar item</button>
        </form>
    </section>

    <section class="panel">
        <h2>Itens cadastrados</h2>
        <table>
            <tbody id="tabela-dados"></tbody>
        </table>
    </section>
</main>

<footer>RAP 90 STORE © 2026</footer>

</body>
</html>

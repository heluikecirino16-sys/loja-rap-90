
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos | RAP 90 STORE</title>
    <link rel="stylesheet" href="../style/style.css">
    <script src="../script/script.js" defer></script>
</head>
<body data-page="pedidos">

<header>
    <h1>RAP 90 STORE</h1>
    <nav>
        <a href="../index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="clientes.html">Clientes</a>
        <a href="funcionarios.html">Funcionários</a>
        <a href="pedidos.html" class="active">Pedidos</a>
        <a href="itens-pedido.html">Itens do Pedido</a>
    </nav>
</header>

<main class="container">
    <h2>Cadastro de Pedidos</h2>

    <section class="panel">
        <form id="formulario">
            <label>ID do cliente</label>
            <input name="id_cliente" type="number" min="1" required>

            <label>ID do funcionário</label>
            <input name="id_funcionario" type="number" min="1" required>

            <label>Status</label>
            <select name="status">
                <option>Pendente</option>
                <option>Em andamento</option>
                <option>Concluído</option>
                <option>Cancelado</option>
            </select>

            <label>Total</label>
            <input name="total" type="number" min="0" step="0.01" required>

            <button class="btn" type="submit">Cadastrar pedido</button>
        </form>
    </section>

    <section class="panel">
        <h2>Pedidos cadastrados</h2>
        <table>
            <tbody id="tabela-dados"></tbody>
        </table>
    </section>
</main>

<footer>RAP 90 STORE © 2026</footer>

</body>
</html>
